# Cloudflare deploys this worker from GitHub on every push to main.
name = "sellercloud-link"
main = "worker.js"
compatibility_date = "2025-01-01"

# Keep the variables set in the Cloudflare dashboard (ASSEMBLE_ENABLED, ASSEMBLE_MAX_QTY and the rest).
# Secrets (APP_KEY, PULL_KEY, ASSEMBLE_KEY, Sellercloud login) are never stored here and are kept by Cloudflare.
keep_vars = true

[[kv_namespaces]]
binding = "TOKEN_KV"
id = "a43f19df95e540fe8b489e3d8e60ee50"

[triggers]
crons = ["*/2 * * * *", "*/5 * * * *"]

# Background kit runs (Nov 19): one Durable Object keeps the queue of kit runs and steps them with its alarm.
[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JobQueue"]

# Labels (Nov 24): one SQLite Durable Object keeps the uploaded label batches and their lines for the Hub's dashboard.
[[durable_objects.bindings]]
name = "LABELS"
class_name = "LabelStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LabelStore"]

# Temporary (Nov 25): holds the label check's results so they can be read back. Removed after the check.
[[d1_databases]]
binding = "DIAG_DB"
database_name = "labels-check-tmp"
database_id = "752b8193-d884-4253-95e9-b11e9ef2459a"
